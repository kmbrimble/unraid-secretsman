name: Release

# This repository is a READ-ONLY MIRROR of the primary repo on a private forge (Gitea). Never push here directly:
# the mirror force-syncs from the primary and would discard anything that exists only on GitHub.
#
# A release is a v* tag pushed to the primary and mirrored here. This workflow then runs the release gates
# (scripts/release-gates.sh: CHANGES entry, Rule 7 recovery-drill note, strcmp ordering), rebuilds the package from
# the tagged source (the build is deterministic), requires the committed unraid-secretsman.plg &md5; to equal the
# rebuilt md5, and publishes the GitHub Release with the .txz and .md5 attached. It does NOT commit, push or tag.
#
# workflow_dispatch is a dry run: it builds and prints the md5 and publishes nothing, so the build can be
# compared with the primary's CI without cutting a release.
#
# Installing the release on the Unraid host cannot run here (GitHub's runners cannot reach it): see
# scripts/install-on-host.sh and CLAUDE.md "Deploy and verify".

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
      NAME: unraid-secretsman
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Work out the version
        run: |
          set -euo pipefail
          PLG_VERSION=$(sed -rn 's|^<!ENTITY version[[:space:]]+"([^"]+)">.*|\1|p' unraid-secretsman.plg)
          [ -n "$PLG_VERSION" ] || { echo "::error::could not read &version; from unraid-secretsman.plg"; exit 1; }
          if [ "$DRY_RUN" = "true" ]; then
            VERSION="$PLG_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            [ "$VERSION" = "$PLG_VERSION" ] || { echo "::error::tag $GITHUB_REF_NAME does not match unraid-secretsman.plg &version; $PLG_VERSION"; exit 1; }
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Release gates (CHANGES entry, Rule 7, version ordering)
        run: bash scripts/release-gates.sh "$VERSION"

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2
        with:
          php-version: '8.4'
          extensions: simplexml

      # Same gate as the primary's CI, repeated deliberately: a release must stand on its own checks.
      - name: Lint
        run: find src plugin tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test
        run: php tests/run.php

      - name: Dry run - report the md5 of this build
        if: env.DRY_RUN == 'true'
        run: bash scripts/check-md5.sh "$VERSION" --report-only

      # The .plg's &md5; is checked twice on this plugin, by the Unraid plugin manager and again by the .plg's own
      # install script, which deletes the download and aborts on a mismatch.
      - name: Rebuild and require the committed md5 to match
        if: env.DRY_RUN != 'true'
        run: bash scripts/check-md5.sh "$VERSION"

      - name: Publish the GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists - nothing to do."
            exit 0
          fi
          awk -v want="###$VERSION" '
            $0 == want { inside = 1; next }
            inside && /^###/ { exit }
            inside { print }
          ' unraid-secretsman.plg > /tmp/notes.md
          gh release create "v$VERSION" \
            "dist/$NAME-$VERSION.txz" "dist/$NAME.md5" \
            --title "v$VERSION" --notes-file /tmp/notes.md

      - name: Summary
        if: env.DRY_RUN != 'true'
        run: |
          {
            echo "### Released v$VERSION"
            echo
            echo "- package: \`$NAME-$VERSION.txz\`"
            echo
            echo "Not yet installed on the Unraid host - run \`scripts/install-on-host.sh\` from the claude-code container."
          } >> "$GITHUB_STEP_SUMMARY"
